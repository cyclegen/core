# CycleGen Finish Template: Executive
# 紺ベース・格式ある報告書スタイル

name: Executive
description: 紺ベース・格式ある経営報告書スタイル

page:
  margin_top: 2.5      # cm
  margin_bottom: 2.5
  margin_left: 2.5
  margin_right: 2.5

colors:
  primary: "1B2A4A"      # 紺
  secondary: "3A5A8C"     # 中間青
  accent: "C49A6C"        # ゴールド
  text: "333333"          # 本文

title:
  font: "Arial"
  size: 24
  color: "1B2A4A"
  bold: true
  alignment: left

heading2:
  font: "Arial"
  size: 14
  color: "1B2A4A"
  bold: true
  border_bottom: true
  border_color: "C49A6C"
  space_before: 18        # pt
  space_after: 6

heading3:
  font: "Arial"
  size: 12
  color: "3A5A8C"
  bold: true
  space_before: 12
  space_after: 4

heading4:
  font: "Arial"
  size: 11
  color: "3A5A8C"
  bold: true
  space_before: 10
  space_after: 3

heading5:
  font: "Arial"
  size: 10.5
  color: "555555"
  bold: false
  italic: true
  space_before: 8
  space_after: 2

body:
  font: "Arial"
  size: 10.5
  color: "333333"
  line_spacing: 1.5
  space_before: 4          # pt
  space_after: 4

list:
  font: "Arial"
  size: 10.5
  color: "333333"
  indent: 1.0             # cm

table:
  header_bg: "1B2A4A"
  header_text: "FFFFFF"
  header_font: "Arial"
  header_size: 10
  body_font: "Arial"
  body_size: 10
  border_color: "CCCCCC"

metadata:
  font: "Arial"
  size: 10.5
  color: "555555"

footer:
  font: "Arial"
  size: 8
  color: "999999"
