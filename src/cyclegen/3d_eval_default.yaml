# 3d-eval.yaml — 3次元記憶 2軸評価基準
# CycleGen Enterprise 設計書v2 §4.4 / CYCLE12再定義
#
# memory_store で Layer/Context が省略された場合、
# この基準がAIエディタに返され、AIが内容を読んで2軸を判定する。
#
# CYCLE12: Priorityは0.3固定（利用実績で動的変動）のため、判定対象外。
#
# 利用者・組織がカスタマイズ可能。
# 配置: ~/.cyclegen/3d-eval.yaml

layer:
  description: "記憶の抽象度（1=最も具体的 〜 5=最も抽象的）"
  criteria:
    5: "メタ認知・学習パターン・思考プロセスの振り返り・自己認識の変化"
    4: "戦略・設計方針・アーキテクチャ判断・ロードマップ・意思決定の記録"
    3: "技術的専門知識・ベストプラクティス・アルゴリズム・パターン"
    2: "具体的な実装手順・コマンド・設定・コードスニペット"
    1: "トラブル対応・エラー解決・障害復旧・基盤情報・インフラ"
  instruction: >
    内容の本質的な抽象度で判断すること。キーワードの有無ではなく、
    記憶の役割（何のために保存するか）で分類する。
    例: 「設計書の振り返り」→ L4（設計判断の記録）であり L5（メタ認知）ではない。

context:
  description: "記憶が最も活用される作業シーン"
  values:
    planning: "計画・設計・方針策定・ロードマップ"
    implementation: "実装・コーディング・開発作業"
    debugging: "バグ修正・トラブルシュート・エラー対応"
    review: "レビュー・振り返り・評価・品質検証"
    learning: "学習・調査・研究・技術検証"
    documentation: "文書作成・記録・ドキュメンテーション"
    operations: "運用・デプロイ・監視・インフラ管理"
  instruction: >
    記憶が将来検索される際、どの作業シーンで最も役立つかを考えて選択する。
    1つだけ選ぶこと。迷う場合は、記憶の主目的に最も近いものを選ぶ。
