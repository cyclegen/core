# Codex 明示専用制御サイドカー（フロントドア cyclegen 用）
# 配置先: ~/.agents/skills/cyclegen/agents/openai.yaml
# 役割: このスキルを「明示起動専用」にする（暗黙起動を抑止）。
#       Claude Code の SKILL.md frontmatter `disable-model-invocation: true` に相当する
#       Codex 側の等価制御。Codex では frontmatter でなくこの別ファイルで指定する
#       （CYCLE14.17 一次確認 developers.openai.com/codex/skills）。
# 効果: モデルは description に基づく暗黙起動をせず、利用者が `$cyclegen` / `/skills` で
#       明示指定したときのみ発火する（誤爆ゼロ）。
policy:
  allow_implicit_invocation: false
