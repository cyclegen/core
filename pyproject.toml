[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyclegen"
version = "0.1.0"
description = "CycleGen — 3次元記憶システム（スキル・記憶ストア）を備えた人間-AI協働フレームワーク"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = ["mcp", "memory", "ai", "knowledge-management", "cyclegen", "context-engineering"]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.25,<2",
]

[project.urls]
Homepage = "https://cyclegen.io"
Repository = "https://github.com/cyclegen/core"
Changelog = "https://github.com/cyclegen/core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docx = [
    "python-docx>=1.0.0",
]
semantic = [
    "fastembed>=0.4",
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cyclegen"]

[project.scripts]
cyclegen-mcp = "cyclegen.mcp.server:main"
cyclegen-mcp-sse = "cyclegen.mcp.server:main_sse"
cyclegen-import = "cyclegen.cli.bulk_import:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
