[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cyclegen"
version = "0.1.1"
description = "CycleGen — 3次元記憶システム（スキル・記憶ストア）を備えた人間-AI協働フレームワーク"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
readme = "README.md"
keywords = ["mcp", "memory", "ai", "knowledge-management", "cyclegen", "context-engineering"]
dependencies = [
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "mcp>=1.25,<2",
]

[project.urls]
Homepage = "https://cyclegen.ai"
Repository = "https://github.com/cyclegen/core"
Changelog = "https://github.com/cyclegen/core/blob/main/CHANGELOG.md"

[project.optional-dependencies]
docx = [
    "python-docx>=1.0.0",
]
semantic = [
    # 上限を切る理由（CYCLE19.1 / A3）:
    # fastembed はモデルのプーリング方式を版間で変更することがある
    # （0.5.1→0.6 で paraphrase-multilingual-MiniLM-L12-v2 が CLS → mean pooling）。
    # 変わると保存済みembeddingとクエリembeddingが別空間になり、
    # 例外を出さずに検索品質だけが落ちる（＝利用者が気づけない）。
    # 動作確認済みは 0.8.x。次のマイナーは検証してから上限を上げること。
    "fastembed>=0.4,<0.9",
    "numpy>=1.24",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.23",
]

[tool.hatch.build.targets.wheel]
packages = ["src/cyclegen"]

# 規律層（プラグイン payload）を wheel に同梱する（CYCLE15.12.2 判断E1 = A-1）。
# `cyclegen setup codex` が clone なしで hooks/skills/agents/manifests を配置するために必要。
#
# ★このテーブルは母艦（_CycleGen_Ent）と公開Core（cyclegen/core）で **左辺のパスだけが異なる**。
#   母艦    : "../plugins/cyclegen-core"（pyproject が cyclegen/ 配下にあるため 1つ上）
#   公開Core: "plugins/cyclegen-core"   （pyproject がリポジトリルートにあるため）
#   CYCLE15.12.1 判断D2（母艦=開発正本・公開Core=配布先の一方向同期）により pyproject は
#   公開Core固有資産＝同期対象外。この1行差は事故ではなく仕様である。
#
# ★src は必ず `packages`（src/cyclegen）の外に置くこと。内側を指すと同一パスへの二重追加で
#   ビルドが落ちる（CYCLE15.3 F5バグ）。
[tool.hatch.build.targets.wheel.force-include]
"plugins/cyclegen-core" = "cyclegen/_payload"

[project.scripts]
# `cyclegen setup codex` の入口（CYCLE15.12.4）。Codex には拡張機構が無いため、
# 既に届いている配布チャネル（PyPI / uvx）から配線する。
cyclegen = "cyclegen.cli.main:main"
cyclegen-mcp = "cyclegen.mcp.server:main"
cyclegen-mcp-sse = "cyclegen.mcp.server:main_sse"
cyclegen-import = "cyclegen.cli.bulk_import:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
